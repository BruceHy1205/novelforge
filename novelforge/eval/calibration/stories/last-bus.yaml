id: last-bus
title: 末班车
source: NovelForge 原创校准稿
renamed: false
ai_generated: true
scenes:
  - scene_id: sc-01
    text: |
      末班车进站时，司机说少了一个人。
      最后上车的是个穿灰外套的乘客，中途就不见了。
      车厢里还坐着四个乘客，谁也不说话。
      车门开了又关，站台上只有风。
  - scene_id: sc-02
    text: |
      第三排座位底下有一只没拿走的手提包。
      包里是一张失物招领单，名字写着韩青。
      同车一个女人认识这个名字。她说韩青是同事，今晚加班，不会在这趟车上。
      女人自己穿着深色外套，领口有一截灰布。
  - scene_id: sc-03
    text: |
      女人的鞋上有新鲜的泥，和站外工地的泥一样。
      她说自己从上车起就坐在第三排，没有下去过。
      第三排的票根不在她手里，而在那只手提包里。
      车顶的灯一闪一闪，没人去修。
  - scene_id: sc-04
    text: |
      女人就是韩青。灰外套是她的。
      她中途下车，把包留在车上，想让人以为韩青已经离开这座城市。
      招领单是她自己的。
