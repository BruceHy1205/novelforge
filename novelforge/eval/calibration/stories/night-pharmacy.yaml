scenes:
  - scene_id: sc-01
    text: |
      药店打烊以后，里面的灯还亮着。
      学徒阿秀说，药剂师沈先生今晚提早走了。
      柜台上一盒降压药的封条是新撕开的。
      街道上没有人，只有卷帘门缝里漏出一条光。
  - scene_id: sc-02
    text: |
      第二天清晨，沈先生倒在库房，杯子还握在手里。
      那盒降压药少了两粒。
      店里的监控在十一点停了。阿秀说是停电。
      杯子底上有一层化不开的白渣。
  - scene_id: sc-03
    text: |
      电工说，那一带整晚都有电。
      阿秀围裙的口袋里有一粒同样的药。
      她说是沈先生让她拿去送给老主顾。
      库房的灯绳是新换的，结打得很紧。
  - scene_id: sc-04
    text: |
      阿秀承认了。沈先生发现她用过期药换货。
      争执时她把两粒药碾进他的杯子。
      监控是她关上的。
