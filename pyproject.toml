[project]
name = "novelforge"
version = "0.1.0"
description = "Canon-isolated AI long-form novel production"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "NovelForge contributors" }]
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "pyyaml>=6.0.1",
    "litellm>=1.40",
    "instructor>=1.3",
    "langgraph>=0.2",
    "langfuse>=2.50",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "fastapi>=0.150.0",
    "uvicorn>=0.30",
    "sqlmodel>=0.0.48",
]

[project.scripts]
novelforge = "novelforge.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["novelforge"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
